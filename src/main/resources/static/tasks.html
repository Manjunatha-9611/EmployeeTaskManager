<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Tasks - Employee Task Manager</title>
</head>
<body>
	<div class="dashboard">
		<aside class="sidebar">
			<h2 class="logo">ETM</h2>
			<nav>
				<a href="index.html">Dashboard</a> <a href="employees.html">Employees</a>
				<a href="tasks.html">Tasks</a>
			</nav>
		</aside>

		<main class="main-content">
			<header class="topbar">
				<div>
					<h1>Task Management</h1>
					<p>Create, assign and track employee tasks</p>
				</div>
			</header>
			<section class="panel">
				<div class="panel-header">
					<h2 id="formTitle">Create New Task</h2>
				</div>
				<form id="taskForm">
					<input type="text" id="title" placeholder="Task Title" required>
					<input type="text" id="description" placeholder="Task Description"
						required> <select id="status" required>
						<option value="pending">Pending</option>
						<option value="in_progress">In Progress</option>
						<option value="completed">Completed</option>
					</select> <select id="employeeId" required>
						<option value="">Select Employee</option>
					</select>
					<button type="submit" class="btn-primary">Create / Update
						Task</button>
					<button type="button" id="cancelEdit" class="btn-cancel"
						style="display: none;">Cancel Edit</button>
				</form>
			</section>
			<section class="panel" style="margin-top: 25px;">
				<div class="panel-header">
					<h2>All Tasks</h2>
					<select id="taskStatusFilter">
						<option value="all">All Tasks</option>
						<option value="pending">Pending</option>
						<option value="in_progress">In Progress</option>
						<option value="completed">Completed</option>
					</select>
				</div>
				<table>
					<thead>
						<tr>
							<th>Title</th>
							<th>Description</th>
							<th>Status</th>
							<th>Employee</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="taskTableBody"></tbody>
				</table>
			</section>
		</main>
	</div>
	<div id="messageModal" class="modal">
		<div class="modal-box">
			<h2 id="messageTitle">Notice</h2>
			<p id="messageText"></p>
			<button id="messageOk" class="btn-primary">OK</button>
		</div>
	</div>
	<div id="deleteModal" class="modal">
		<div class="modal-box">
			<div id="deleteConfirmation">
				<h2>Delete Task?</h2>
				<p>Are you sure you want to delete this task?</p>
				<div class="modal-buttons">
					<button id="cancelDelete" class="btn-cancel">NO</button>
					<button id="confirmDelete" class="btn-delete">Yes,Delete</button>
				</div>
			</div>
			<div id="deleteSuccess" style="display: none;">
				<h2>Success!</h2>
				<p>Task Deleted Successfully.</p>

				<button id="successOk" class="btn-primary">OK</button>
			</div>
		</div>
	</div>
	<script src="tasks.js"></script>
</body>
</html>
