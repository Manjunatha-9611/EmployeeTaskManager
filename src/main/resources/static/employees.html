<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Employees - Employee Task Manager</title>
</head>
<body>
    <div class="dashboard">

        <aside class="sidebar">
            <h2 class="logo">ETM</h2>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="employees.html">Employees</a>
                <a href="tasks.html">Tasks</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Employees</h1>
                    <p>Manage your employees</p>
                </div>

                <button type="button" id="addEmployeeBtn" class="btn-primary">
                    +Add Employee
                </button>
            </header>

            <section class="panel">

                <div class="panel-header">
                    <h2>Employee Management</h2>
                </div>

                <!-- Search and department filter -->
                <div class="employee-controls">
                    <input
                        type="text"
                        id="employeeSearch"
                        placeholder="Search by name, ID, or email..."
                        autocomplete="off"
                    >

                    <select id="departmentFilter">
                        <option value="all">All Departments</option>
                    </select>
                </div>

                <!-- Add / Edit Employee Form -->
                <div class="employee-form-panel">
                    <div class="panel-header">
                        <h2>Add / Edit Employee</h2>
                    </div>

                    <form id="employeeForm">
                        <input
                            type="text"
                            class="inputs"
                            id="name"
                            placeholder="Name"
                            autocomplete="name"
                            required
                        >

                        <input
                            type="email"
                            class="inputs"
                            id="email"
                            placeholder="Email"
                            autocomplete="email"
                            required
                        >

                        <input
                            type="text"
                            class="inputs"
                            id="department"
                            placeholder="Department"
                            autocomplete="organization-title"
                            required
                        >

                        <input
                            type="number"
                            class="inputs"
                            id="salary"
                            placeholder="Salary"
                            autocomplete=0
                            min="0"
                            required
                        >

                        <button type="submit" class="btn-primary">
                            Submit
                        </button>
                    </form>
                </div>

                <!-- Employee Table -->
                <div class="employee-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Salary</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="employeeTableBody">
                        </tbody>
                    </table>
                </div>

            </section>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-box">

            <div id="deleteConfirmation">
                <h2>Delete Employee?</h2>
                <p>Are you sure you want to delete this employee?</p>

                <div class="modal-buttons">
                    <button type="button" id="cancelDelete" class="btn-cancel">
                        No
                    </button>

                    <button type="button" id="confirmDelete" class="btn-delete">
                        Yes, Delete
                    </button>
                </div>
            </div>

            <div id="deleteSuccess" style="display: none;">
                <h2>Success</h2>
                <p>Employee deleted successfully.</p>

                <button type="button" id="successOk" class="btn-primary">
                    OK
                </button>
            </div>

        </div>
    </div>

    <!-- General Success / Error Message Modal -->
    <div id="messageModal" class="modal">
        <div class="modal-box">
            <h2 id="messageTitle">Success</h2>
            <p id="messageText"></p>

            <button type="button" id="messageOk" class="btn-primary">
                OK
            </button>
        </div>
    </div>

    <script src="./employees.js"></script>
</body>
</html>
