spring.application.name=employee-task-manager
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_task_manager}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#we are setting the ddl commands to execute automatically by this line
spring.jpa.hibernate.ddl-auto=update   

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
